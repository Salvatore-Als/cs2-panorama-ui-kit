[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uikit"
version = "1.0.0"
description = "Panorama UI Kit tooling: layout contracts, checker, generator and docs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uikit = "uikit.cli:main"

[tool.setuptools.packages.find]
include = ["uikit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
